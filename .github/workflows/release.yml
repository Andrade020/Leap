name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet publish Leap.csproj -c Release -r win-x64 --self-contained false -o publish
      - name: Empacotar
        shell: pwsh
        run: Compress-Archive publish/* "leap-${{ github.ref_name }}-win-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: leap-*.zip
          generate_release_notes: true
